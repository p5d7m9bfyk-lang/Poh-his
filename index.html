<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123c3a">
<title>POH Simulator — Oefen-HIS</title>
<style>
:root{--bg:#f2f6f5;--card:#fff;--ink:#19312e;--muted:#637873;--line:#dce7e3;--green:#176b5b;--green2:#e4f4ee;--amber:#fff2d6;--red:#a92c2c;--blue:#eaf2ff;--shadow:0 3px 14px #123c3a0c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7ab9aa;outline-offset:2px}
header{background:linear-gradient(115deg,#123c3a,#1b6557);color:white;padding:calc(14px + env(safe-area-inset-top)) 15px 14px;position:sticky;top:0;z-index:5;box-shadow:0 3px 12px #123c3a22}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-size:18px;font-weight:850}.sub{font-size:11px;opacity:.8}.shift{font-size:11px;border:1px solid #ffffff55;border-radius:99px;padding:5px 8px;white-space:nowrap}
main{max-width:900px;margin:auto;padding:13px 12px 100px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px #123c3a0a}.nav button{border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:750;padding:5px 1px;border-radius:10px}.nav button.active{background:var(--green2);color:var(--green)}.ni{display:block;font-size:19px;line-height:1.1;margin-bottom:3px}
h1{font-size:23px;letter-spacing:-.5px;margin:0 0 3px}h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:0 0 7px}.muted,.small{color:var(--muted)}.small{font-size:12px}.tiny{font-size:10px;color:var(--muted)}.eyebrow{text-transform:uppercase;letter-spacing:1px;font-size:10px;color:var(--green);font-weight:850}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:4px 2px 13px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;box-shadow:var(--shadow)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{background:white;border:1px solid var(--line);border-radius:13px;padding:12px}.stat label{display:block;font-size:11px;color:var(--muted)}.stat strong{font-size:23px;letter-spacing:-.6px}.row{display:flex;gap:10px;align-items:center}.between{display:flex;justify-content:space-between;align-items:center;gap:10px}.avatar{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--green2);color:var(--green);font-weight:850;flex-shrink:0}.pill{display:inline-block;padding:4px 8px;border-radius:99px;font-size:10px;font-weight:800;background:#edf2f0;color:#415653}.pill.green{background:var(--green2);color:var(--green)}.pill.amber{background:var(--amber);color:#805a08}.pill.red{background:#fde8e8;color:var(--red)}.btn{border:0;border-radius:10px;background:var(--green);color:white;font-weight:800;padding:10px 12px;font-size:13px}.btn.secondary{background:#edf3f1;color:var(--ink);border:1px solid var(--line)}.btn.ghost{background:white;color:var(--green);border:1px solid var(--line)}.btn.danger{background:#a92c2c}.btn:disabled{opacity:.45;cursor:not-allowed}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #ccd9d4;border-radius:10px;padding:10px;background:white;color:var(--ink)}.field textarea{min-height:90px;resize:vertical}.field input[type=checkbox]{width:auto}.notice{padding:10px 12px;border-radius:10px;background:var(--blue);font-size:12px;margin:9px 0}.notice.warn{background:var(--amber)}.notice.good{background:var(--green2)}.notice.danger{background:#fde8e8}.item{border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0;background:#fff}.item p{margin:5px 0}.item .btn{padding:8px 10px}.tabs{display:flex;gap:6px;overflow:auto;margin:10px 0}.tabs button{white-space:nowrap;border:1px solid var(--line);border-radius:99px;padding:7px 11px;background:white;color:var(--muted);font-size:12px;font-weight:750}.tabs button.active{background:var(--green2);color:var(--green);border-color:#b5dbce}.table{width:100%;border-collapse:collapse;font-size:12px}.table td,.table th{text-align:left;padding:8px 5px;border-bottom:1px solid var(--line);vertical-align:top}.table th{color:var(--muted);font-weight:800}.empty{padding:18px;text-align:center;color:var(--muted);font-size:13px}.progress{height:7px;background:#e5ece9;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#25856e;border-radius:99px}.checkrow{display:flex;align-items:flex-start;gap:8px;padding:7px 0}.checkrow input{margin-top:4px}.checkrow span{font-size:13px}.separator{height:1px;background:var(--line);margin:12px 0}.toast{position:fixed;left:12px;right:12px;bottom:88px;background:#19312e;color:white;border-radius:12px;padding:12px 14px;z-index:20;box-shadow:var(--shadow);font-size:13px}.footer{font-size:10px;color:var(--muted);text-align:center;margin:16px 5px}.risk{border-left:4px solid #c98b17;padding:8px 10px;background:#fff7e6;border-radius:0 9px 9px 0;font-size:12px}
@media(min-width:650px){main{padding:20px 20px 100px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.workspace{display:grid;grid-template-columns:1fr 1fr;gap:12px}.workspace .card{margin:0 0 12px}}
</style>
</head>
<body>
<header><div class="top"><div><div class="brand">✚ POH Simulator</div><div class="sub">Oefen-HIS · Huisartsenpraktijk De Linde</div></div><div class="shift" id="clock">MA · 08:15</div></div></header>
<main id="app"></main>
<nav class="nav">
<button data-tab="home" class="active"><span class="ni">⌂</span>Overzicht</button>
<button data-tab="patients"><span class="ni">♙</span>Patiënten</button>
<button data-tab="consult"><span class="ni">▤</span>Consult</button>
<button data-tab="orders"><span class="ni">＋</span>Aanvragen</button>
<button data-tab="career"><span class="ni">↗</span>Voortgang</button>
</nav>
<div id="toast" class="toast" hidden></div>
<script>
const patients=[
{id:"P-10482",name:"De heer Jansen",age:58,initials:"HJ",problem:"Diabetes mellitus type 2",appointment:"Diabetescontrole",status:"In consult",intro:"Ik ben de laatste tijd erg moe. Ik heb ook meer dorst en moet vaker plassen.",history:"DM2 · metformine · laatste HbA1c 53 mmol/mol",vitals:[["Glucose","22,4","mmol/L"],["Pols","104","/min"],["Bloeddruk","108/70","mmHg"],["Ademhaling","20","/min"]],risk:"Duidelijke hyperglykemie met klachten en tachycardie. Laat dit in deze oefencasus direct beoordelen door de huisarts; geen zelfstandig behandelbesluit.",tasks:["Klachten en alarmsymptomen uitvragen","Vitale parameters controleren","Medicatie en therapietrouw verifiëren","Huisarts tijdig informeren"]},
{id:"P-10511",name:"Mevrouw Bakker",age:64,initials:"MB",problem:"Hypertensie",appointment:"Bloeddrukcontrole",status:"Gepland",intro:"Ik heb thuis een paar keer een hogere bloeddruk gemeten.",history:"Hypertensie · controle gepland · medicatie volgens dossier",vitals:[["Bloeddruk","156/94","mmHg"],["Pols","78","/min"]],risk:"Beoordeel meetomstandigheden, herhaal meting volgens protocol en bespreek beleid met huisarts volgens praktijkafspraken.",tasks:["Meetmethode en thuismetingen bespreken","Klachten en risicofactoren uitvragen","Herhaalmeting vastleggen","Vervolgbeleid afstemmen"]},
{id:"P-10536",name:"De heer Visser",age:71,initials:"JV",problem:"CVRM-controle",appointment:"CVRM-controle",status:"Gepland",intro:"Ik wil weten hoe het met mijn cholesterol en risico zit.",history:"CVRM · eerdere lipidencontrole · rookstatus nog te actualiseren",vitals:[["Bloeddruk","142/86","mmHg"],["Pols","76","/min"]],risk:"Controleer dossiergegevens en bespreek risicoprofiel en beleid binnen de afspraken met de huisarts.",tasks:["Roken, bewegen en voeding uitvragen","Medicatiegebruik controleren","Meetwaarden en labhistorie bekijken","Gezamenlijk plan vastleggen"]},
{id:"P-10602",name:"Mevrouw Smit",age:49,initials:"AS",problem:"Vermoeidheid",appointment:"Vervolgconsult",status:"Gepland",intro:"Ik ben al weken moe en kom moeilijk op gang.",history:"Vermoeidheidsklachten · nog geen uitgewerkt plan",vitals:[["Bloeddruk","124/78","mmHg"],["Pols","82","/min"],["Temperatuur","36,8","°C"]],risk:"Breng duur, beloop, functioneren en alarmsymptomen in kaart. Onderzoek aanvragen gebeurt in overleg met de huisarts en volgens lokaal protocol.",tasks:["Duur en invloed van klachten bespreken","Slaap, stemming en leefstijl uitvragen","Alarmsymptomen navragen","Bevindingen en vervolgafspraken vastleggen"]}
];
const state={tab:"home",pid:0,sub:"journaal",notes:[],orders:[],results:[],tasks:{},vitals:[],actions:[],xp:0,done:0,day:1,minutes:15,selectedPlan:"",feedback:"",planSaved:false,toastTimer:null};
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function p(){return patients[state.pid]}
function now(){return "08:"+String(state.minutes%60).padStart(2,"0")}
function toast(msg){const el=document.getElementById("toast");el.textContent=msg;el.hidden=false;clearTimeout(state.toastTimer);state.toastTimer=setTimeout(()=>el.hidden=true,2600)}
function card(title,body,extra=""){return `<section class="card ${extra}"><h2>${title}</h2>${body}</section>`}
function head(kicker,title,desc=""){return `<div class="head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1>${desc?`<div class="muted small">${desc}</div>`:""}</div></div>`}
function btn(label,fn,cls=""){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}
function nav(t){state.tab=t;render()}
document.querySelectorAll(".nav button").forEach(b=>b.addEventListener("click",()=>nav(b.dataset.tab)));
function render(){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===state.tab));document.getElementById("clock").textContent="MA · "+(8+Math.floor(state.minutes/60))+":"+String(state.minutes%60).padStart(2,"0");app.innerHTML=state.tab==="home"?home():state.tab==="patients"?patientList():state.tab==="consult"?consult():state.tab==="orders"?ordersPage():career()}
function home(){return head("WERKDAG 1","Goedemorgen, POH i.o.","Je oefent in een volledig fictieve huisartsenpraktijk.")+`<div class="grid"><div class="stat"><label>Consulten vandaag</label><strong>${state.done}/4</strong><div class="small">Afgerond</div></div><div class="stat"><label>Journaalregels</label><strong>${state.notes.length}</strong><div class="small">Zelf genoteerd</div></div><div class="stat"><label>Aanvragen</label><strong>${state.orders.length}</strong><div class="small">Lab / onderzoek</div></div><div class="stat"><label>Leerpunten</label><strong>${state.xp} XP</strong><div class="small">Oefenvoortgang</div></div></div>`+
card("Werkvoorraad",patients.map((x,i)=>`<div class="item"><div class="row"><div class="avatar">${x.initials}</div><div style="flex:1"><div class="between"><b>${x.name}</b><span class="pill ${i===0?"amber":"green"}">${i===0?"Nu":"Gepland"}</span></div><div class="small">${x.age} jaar · ${x.appointment}</div></div></div><div class="btnrow">${btn("Dossier openen",`openPatient(${i})`,"secondary")}${btn("Consult starten",`startConsult(${i})`)}</div></div>`).join(""))+
card("Jouw rol in deze simulator",`<div class="notice">Dit is een educatieve simulatie met fictieve patiëntgegevens. Je kunt journaalregels schrijven, onderzoek aanvragen, resultaten verwerken en een vervolgplan noteren.</div><div class="risk">In de praktijk werk je binnen je bevoegdheid, bekwaamheid, lokale protocollen en afspraken met de huisarts. Aanvragen en behandelbesluiten in deze game zijn oefenhandelingen, geen echte medische opdrachten.</div>`)
}
function patientList(){return head("HIS · PATIËNTEN","Patiëntendossiers","Kies een fictieve patiënt om het dossier te openen.")+patients.map((x,i)=>`<div class="item"><div class="row"><div class="avatar">${x.initials}</div><div style="flex:1"><b>${x.name}</b><div class="small">${x.age} jaar · ${x.problem}</div><div class="small">${x.appointment}</div></div>${btn("Open",`openPatient(${i})`,"secondary")}</div></div>`).join("")}
function openPatient(i){state.pid=i;state.tab="consult";state.sub="journaal";render()}
function startConsult(i){state.pid=i;state.tab="consult";state.sub="consult";render()}
function subtab(t){state.sub=t;render()}
function consult(){const x=p();const patientNotes=state.notes.filter(n=>n.pid===x.id);const patientOrders=state.orders.filter(o=>o.pid===x.id);const patientResults=state.results.filter(r=>r.pid===x.id);
let tabs=`<div class="tabs">${[["journaal","Journaal"],["consult","Consult"],["metingen","Metingen"],["plan","Evaluatie & plan"]].map(([k,v])=>`<button class="${state.sub===k?"active":""}" onclick="subtab('${k}')">${v}</button>`).join("")}</div>`;
let intro=`<div class="row"><div class="avatar">${x.initials}</div><div style="flex:1"><h2 style="margin:0">${x.name}</h2><div class="small">${x.age} jaar · ${x.id}</div><div class="small">${x.problem}</div></div><span class="pill green">Fictief dossier</span></div><div class="separator"></div><div><b>Hulpvraag</b><p>“${x.intro}”</p><div class="small"><b>Voorgeschiedenis:</b> ${x.history}</div></div>`;
let body="";
if(state.sub==="journaal"){body=card("Journaal / SOEP",`<div class="notice">Noteer beknopt en objectief. Maak onderscheid tussen wat de patiënt vertelt, wat je zelf meet en welke afspraken je maakt.</div><div class="field"><label>Type journaalregel</label><select id="noteType"><option value="S">S — Subjectief (hulpvraag/klachten)</option><option value="O">O — Objectief (metingen/observaties)</option><option value="E">E — Evaluatie / werkhypothese</option><option value="P">P — Plan / afspraken</option></select></div><div class="field"><label>Journaaltekst</label><textarea id="noteText" placeholder="Bijv. Patiënt geeft aan sinds ..."></textarea></div><div class="field"><label>Vervolg / afspraak (optioneel)</label><input id="noteFollow" placeholder="Bijv. Overleg huisarts, terugkoppeling ..."></div>${btn("Journaalregel opslaan","saveNote()")} <div class="small" style="margin-top:8px">Opslaan voegt de tekst toe aan het fictieve dossier op dit apparaat zolang de pagina open blijft.</div>`)+card("Eerdere journaalregels",patientNotes.length?patientNotes.slice().reverse().map(n=>`<div class="item"><div class="between"><b>${n.type} — ${esc(n.label)}</b><span class="tiny">${n.time}</span></div><p>${esc(n.text)}</p>${n.follow?`<div class="small"><b>Vervolg:</b> ${esc(n.follow)}</div>`:""}</div>`).join(""):`<div class="empty">Nog geen journaalregels. Schrijf hierboven je eerste notitie.</div>`)}
if(state.sub==="consult"){body=card("Consult uitvoeren",`<div class="notice">Werk als POH i.o.: verzamel informatie, signaleer risico's, leg bevindingen vast en overleg wanneer dat nodig is. Stel niet zelfstandig een diagnose of behandeling vast buiten de afspraken.</div><h3>Hulpvraag</h3><p>${x.intro}</p><h3>Checklist anamnese</h3>${x.tasks.map((t,i)=>`<label class="checkrow"><input type="checkbox" ${state.tasks[x.id+"-"+i]?"checked":""} onchange="toggleTask('${x.id}-${i}',this.checked)"><span>${t}</span></label>`).join("")}<div class="field"><label>Wat heb je aanvullend uitgevraagd?</label><textarea id="extraHx" placeholder="Duur, beloop, ernst, begeleidende klachten, alarmsymptomen, medicatie..."></textarea></div>${btn("Anamnese in journaal zetten","addHx()","secondary")} ${btn("Naar metingen","subtab('metingen')")}`);
}
if(state.sub==="metingen"){body=card("Metingen en observaties",`<div class="notice">De waarden hieronder zijn fictieve startgegevens. Vul aanvullende metingen alleen in als je ze in de casus hebt verricht.</div><table class="table"><thead><tr><th>Meting</th><th>Waarde</th><th>Eenheid</th></tr></thead><tbody>${x.vitals.map(v=>`<tr><td>${v[0]}</td><td><b>${v[1]}</b></td><td>${v[2]}</td></tr>`).join("")}${state.vitals.filter(v=>v.pid===x.id).map(v=>`<tr><td>${esc(v.name)}</td><td><b>${esc(v.value)}</b></td><td>${esc(v.unit)}</td></tr>`).join("")}</tbody></table><div class="separator"></div><h3>Nieuwe meting noteren</h3><div class="field"><label>Type meting</label><select id="vName"><option>Bloeddruk</option><option>Pols</option><option>Temperatuur</option><option>Gewicht</option><option>Glucose</option><option>Ademhaling</option><option>SpO₂</option></select></div><div class="grid"><div class="field"><label>Waarde</label><input id="vValue" placeholder="Bijv. 128/82"></div><div class="field"><label>Eenheid</label><input id="vUnit" placeholder="mmHg, /min, °C..."></div></div>${btn("Meting vastleggen","saveVital()")} ${btn("Naar aanvragen","nav('orders')","secondary")}`)+card("Veiligheidssignaal",`<div class="risk">${x.risk}</div>`)}
if(state.sub==="plan"){body=card("Evaluatie en vervolgplan",`<div class="notice">Kies wat je als POH i.o. in deze casus doet. De feedback is bedoeld om je klinisch redeneren te oefenen.</div><div class="field"><label>Wat is je eerstvolgende stap?</label><select id="planChoice"><option value="">Kies een optie…</option><option value="overleg">Overleg met huisarts en draag bevindingen over</option><option value="routine">Plan alleen een routinecontrole in</option><option value="order">Vraag onderzoek aan zonder overleg</option><option value="advies">Geef direct behandeladvies zonder afstemming</option></select></div><div class="field"><label>Plan / veiligheidsnet (in eigen woorden)</label><textarea id="planText" placeholder="Wat leg je vast? Wie doet wat, wanneer volgt controle en welke alarmsymptomen bespreek je?"></textarea></div>${btn("Plan beoordelen en opslaan","savePlan()")} ${state.feedback?`<div class="notice ${state.feedback.startsWith("Goed")?"good":"warn"}">${state.feedback}</div>`:""}`)+card("Aanvragen en resultaten",patientOrders.length?patientOrders.map(o=>`<div class="item"><div class="between"><b>${esc(o.test)}</b><span class="pill ${o.status==="Resultaat beschikbaar"?"green":"amber"}">${o.status}</span></div><div class="small">${esc(o.reason)}</div>${o.status==="Resultaat beschikbaar"?`<p><b>Uitslag:</b> ${esc(o.result)}</p>`:btn("Simuleer uitslag ontvangen",`receiveResult(${o.id})`,"secondary")}</div>`).join(""):`<div class="empty">Geen aanvragen voor deze patiënt.</div>`)+card("Consult afronden",`<p class="small">Rond een consult pas af als je bevindingen, overdracht en vervolgafspraken hebt vastgelegd.</p>${btn("Consult afronden","finishConsult()")}`)}
return head("HIS · DOSSIER",x.name,`${x.age} jaar · ${x.problem}`)+card("Patiëntsamenvatting",intro)+tabs+body+`<div class="footer">Alle gegevens en orders zijn fictief en blijven lokaal in deze pagina.</div>`
}
function saveNote(){const type=document.getElementById("noteType").value,text=document.getElementById("noteText").value.trim(),follow=document.getElementById("noteFollow").value.trim();if(!text){toast("Vul eerst een journaaltekst in.");return}state.notes.push({pid:p().id,type,label:({S:"Subjectief",O:"Objectief",E:"Evaluatie",P:"Plan"})[type],text,follow,time:"08:"+String(state.minutes%60).padStart(2,"0")});state.xp+=2;state.minutes+=2;toast("Journaalregel opgeslagen in het fictieve dossier.");render()}
function addHx(){const el=document.getElementById("extraHx"),t=el.value.trim();if(!t){toast("Vul eerst je aanvullende anamnese in.");return}state.notes.push({pid:p().id,type:"S",label:"Aanvullende anamnese",text:t,follow:"",time:"08:"+String(state.minutes%60).padStart(2,"0")});state.xp+=2;toast("Anamnese toegevoegd aan het journaal.");render()}
function toggleTask(k,v){state.tasks[k]=v;if(v)state.xp+=1}
function saveVital(){const name=document.getElementById("vName").value,value=document.getElementById("vValue").value.trim(),unit=document.getElementById("vUnit").value.trim();if(!value){toast("Vul een waarde in.");return}state.vitals.push({pid:p().id,name,value,unit});state.notes.push({pid:p().id,type:"O",label:"Meting",text:`${name}: ${value} ${unit}`.trim(),follow:"",time:"08:"+String(state.minutes%60).padStart(2,"0")});state.xp+=1;toast("Meting vastgelegd en als objectieve journaalregel toegevoegd.");render()}
function savePlan(){const choice=document.getElementById("planChoice").value,text=document.getElementById("planText").value.trim();if(!choice||!text){toast("Kies een vervolgstap en noteer je plan.");return}let good=(p().id==="P-10482"?choice==="overleg":choice==="overleg"||choice==="routine");state.feedback=good?"Goed: je kiest een veilige vervolgstap en legt je onderbouwing vast. Controleer in de praktijk altijd het lokale protocol en stem het beleid af met de huisarts.":"Denk nog eens na over urgentie, je rol en de afspraken met de huisarts. In deze casus is het belangrijk om bevindingen te onderbouwen en zo nodig te overleggen vóór je zelfstandig vervolgstappen kiest.";state.notes.push({pid:p().id,type:"P",label:"Vervolgplan",text,follow:choice==="overleg"?"Overleg huisarts":choice==="routine"?"Routinecontrole":choice==="order"?"Onderzoek aangevraagd":"Advies gegeven",time:"08:"+String(state.minutes%60).padStart(2,"0")});state.planSaved=true;state.xp+=good?5:1;render()}
function finishConsult(){if(!state.notes.some(n=>n.pid===p().id)){toast("Leg eerst je bevindingen vast in het journaal.");return}state.done=Math.min(4,state.done+1);state.xp+=3;toast("Consult gemarkeerd als afgerond in de simulatie.");nav("home")}
function ordersPage(){let x=p();return head("HIS · AANVRAGEN","Onderzoek aanvragen","Oefen met het kiezen en onderbouwen van aanvullend onderzoek.")+card("Actieve patiënt",`<div class="field"><label>Kies patiënt</label><select id="orderPid" onchange="setOrderPatient(this.value)">${patients.map((x,i)=>`<option value="${i}" ${state.pid===i?"selected":""}>${x.name} — ${x.problem}</option>`).join("")}</select></div><div class="small">Aanvragen zijn alleen simulaties. In een echte praktijk bepaalt het protocol en de samenwerking met de huisarts wie een onderzoek mag aanvragen.</div>`)+card("Nieuwe aanvraag",`<div class="field"><label>Type aanvraag</label><select id="orderType"><option value="Laboratorium">Laboratoriumonderzoek</option><option value="Urineonderzoek">Urineonderzoek</option><option value="ECG">ECG</option><option value="Thuismetingen">Thuismetingen / bloeddrukdagboek</option><option value="Overleg">Overleg / beoordeling huisarts</option><option value="Verwijzing">Verwijzing bespreken</option></select></div><div class="field"><label>Onderzoek / vraagstelling</label><input id="orderTest" placeholder="Bijv. HbA1c, nierfunctie, urine dipstick…"></div><div class="field"><label>Reden / klinische vraag</label><textarea id="orderReason" placeholder="Welke vraag wil je beantwoorden? Wat is de context?"></textarea></div><div class="field"><label>Afgestemd met huisarts?</label><select id="orderApproval"><option value="yes">Ja, in deze oefencasus afgestemd</option><option value="pending">Nog overleggen vóór aanvraag</option></select></div>${btn("Aanvraag opslaan","saveOrder()")}`)+card("Aanvragenlijst",state.orders.length?state.orders.slice().reverse().map(o=>`<div class="item"><div class="between"><b>${esc(o.test)}</b><span class="pill ${o.status==="Resultaat beschikbaar"?"green":"amber"}">${o.status}</span></div><div class="small">${esc(o.type)} · ${esc(patients.find(x=>x.id===o.pid)?.name||"Patiënt")}</div><p>${esc(o.reason)}</p>${o.status!=="Resultaat beschikbaar"?btn("Resultaat simuleren",`receiveResult(${o.id})`,"secondary"):`<div class="notice good"><b>Uitslag:</b> ${esc(o.result)}</div>`}</div>`).join(""):`<div class="empty">Je hebt nog geen aanvragen gedaan.</div>`)+card("Hoe werkt aanvragen in de simulator?",`<ul class="small"><li>Beschrijf de klinische vraag, niet alleen de testnaam.</li><li>Vraag bij twijfel eerst overleg aan in plaats van zelfstandig onderzoek te bestellen.</li><li>Verwerk een uitslag altijd in de context van klachten en meetwaarden.</li><li>Een afwijkende uitslag kan een nieuwe actie of overleg nodig maken.</li></ul>`)}
function setOrderPatient(v){state.pid=Number(v);render()}
function saveOrder(){const type=document.getElementById("orderType").value,test=document.getElementById("orderTest").value.trim(),reason=document.getElementById("orderReason").value.trim(),approval=document.getElementById("orderApproval").value;if(!test||!reason){toast("Vul de aanvraag én de klinische vraag in.");return}const id=Date.now();state.orders.push({id,pid:p().id,type,test,reason,approval,status:approval==="pending"?"Eerst overleggen":"Aangevraagd (simulatie)",result:""});state.notes.push({pid:p().id,type:"P",label:"Aanvraag / overleg",text:`${type}: ${test}. Vraagstelling: ${reason}`,follow:approval==="pending"?"Eerst afstemmen met huisarts":"Afgestemd in simulatie",time:"08:"+String(state.minutes%60).padStart(2,"0")});state.xp+=2;toast(approval==="pending"?"Genoteerd: eerst overleggen met de huisarts.":"Aanvraag vastgelegd in de simulatie.");render()}
function receiveResult(id){const o=state.orders.find(o=>o.id===id);if(!o)return;if(o.approval==="pending"){o.status="Wacht op overleg";toast("Bespreek de aanvraag eerst met de huisarts.");render();return}const test=o.test.toLowerCase();let result="Geen bijzonderheden in deze fictieve uitslag.";if(test.includes("hba1c"))result="HbA1c 68 mmol/mol — verhoogd in deze fictieve casus; bespreek interpretatie en beleid met huisarts.";else if(test.includes("glucose"))result="Glucose 22,4 mmol/L — fors verhoogd; klachten en urgentie bepalen de vervolgstap. Direct huisarts informeren in deze casus.";else if(test.includes("nier")||test.includes("creatin"))result="eGFR 72 ml/min/1,73 m² — interpreteer met eerdere waarden en klinische context.";else if(test.includes("urine"))result="Glucose ++, ketonen negatief — fictieve uitslag; beoordeel samen met klachten en overleg volgens protocol.";else if(o.type==="Overleg")result="Huisarts heeft de casus beoordeeld en wil de patiënt vandaag terugzien.";else if(o.type==="Thuismetingen")result="Gemiddelde thuismeting 148/91 mmHg — bespreek meetkwaliteit en vervolgbeleid met huisarts.";else if(o.type==="ECG")result="Geen acute afwijkingen beschreven in dit fictieve voorbeeld; dit sluit een aandoening niet uit.";o.status="Resultaat beschikbaar";o.result=result;state.results.push({pid:o.pid,test:o.test,result});state.notes.push({pid:o.pid,type:"O",label:"Uitslag ontvangen",text:`${o.test}: ${result}`,follow:"Uitslag beoordelen en zo nodig overleggen",time:"08:"+String(state.minutes%60).padStart(2,"0")});state.xp+=2;toast("Fictieve uitslag toegevoegd. Beoordeel en documenteer de vervolgstap.");render()}
function career(){return head("LEERVOORTGANG","Jouw ontwikkeling","Oefenvaardigheden en acties in deze fictieve praktijk.")+`<div class="grid"><div class="stat"><label>Ervaring</label><strong>${state.xp} XP</strong><div class="progress"><div style="width:${Math.min(100,state.xp)}%"></div></div></div><div class="stat"><label>Consulten afgerond</label><strong>${state.done}</strong></div><div class="stat"><label>Journaalregels</label><strong>${state.notes.length}</strong></div><div class="stat"><label>Aanvragen</label><strong>${state.orders.length}</strong></div></div>`+card("Oefendoelen",`<div class="checkrow"><span>${state.notes.length?"☑":"○"}</span><span>Minstens één journaalregel schrijven</span></div><div class="checkrow"><span>${state.orders.length?"☑":"○"}</span><span>Een aanvraag onderbouwen met een klinische vraag</span></div><div class="checkrow"><span>${state.results.length?"☑":"○"}</span><span>Een fictieve uitslag verwerken</span></div><div class="checkrow"><span>${state.done?"☑":"○"}</span><span>Een consult zorgvuldig afronden</span></div>`)+card("Reflectie",`<div class="field"><label>Wat ging goed?</label><textarea id="reflectGood" placeholder="Bijv. Ik vroeg door op alarmsymptomen..."></textarea></div><div class="field"><label>Wat wil je volgende keer verbeteren?</label><textarea id="reflectNext" placeholder="Bijv. Mijn journaalnotitie objectiever formuleren..."></textarea></div>${btn("Reflectie bewaren","saveReflection()","secondary")}`)+card("Opnieuw beginnen",`<p class="small">Dit wist alle notities, aanvragen en voortgang van deze sessie.</p>${btn("Reset simulatie","resetAll()","danger")}`)}
function saveReflection(){const a=document.getElementById("reflectGood").value.trim(),b=document.getElementById("reflectNext").value.trim();if(!a&&!b){toast("Schrijf eerst iets bij je reflectie.");return}state.notes.push({pid:p().id,type:"P",label:"Leerreflectie",text:`Goed: ${a||"—"} Volgende keer: ${b||"—"}`,follow:"Persoonlijk leerpunt",time:"08:"+String(state.minutes%60).padStart(2,"0")});toast("Reflectie bewaard in je oefenlogboek.");render()}
function resetAll(){if(!confirm("Weet je zeker dat je de volledige oefensessie wilt resetten?"))return;state.notes=[];state.orders=[];state.results=[];state.vitals=[];state.tasks={};state.xp=0;state.done=0;state.feedback="";state.planSaved=false;state.minutes=15;toast("Oefensessie opnieuw gestart.");nav("home")}
render();
</script>
</body>
</html>
